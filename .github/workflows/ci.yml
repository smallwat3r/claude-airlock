name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck docker/squid-ask-helper.sh test/smoke/run.sh test/smoke/inside/*.sh
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Which files and which rules: pyproject.toml. Which versions: uv.lock
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy

  test:
    runs-on: ${{ matrix.os }}
    # The tests end a check that hangs themselves, this is for what they miss
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest the launcher promises to run on, and the latest
        include:
          - python: "3.13"
            os: ubuntu-latest
          - python: "3.15"
            os: ubuntu-latest
          # Docker Desktop on macOS is supported: the launcher's side of
          # it, which is all these tests run, on the latest Python there
          - python: "3.15"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked --no-default-groups --group test pytest
      # Every feature must assemble into the generated Dockerfile
      - run: uv run --locked --no-default-groups python bin/claude-airlock --dockerfile | grep -q '^ENTRYPOINT'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Base and tail plus one small feature, the full set takes too long
      - run: CLAUDE_AIRLOCK_FEATURES=go bin/claude-airlock --rebuild
