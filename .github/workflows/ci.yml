name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # ruff, its formatter, shellcheck and mypy, as the Makefile runs them.
      # Which files and which rules: pyproject.toml. Which versions: uv.lock
      - run: make lint types

  test:
    runs-on: ${{ matrix.os }}
    # The tests end a check that hangs themselves, this is for what they miss
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest the launcher promises to run on, and the latest
        include:
          - python: "3.13"
            os: ubuntu-latest
          - python: "3.15"
            os: ubuntu-latest
          # Docker Desktop on macOS is supported: the launcher's side of
          # it, which is all these tests run, on the latest Python there
          - python: "3.15"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked --no-default-groups --group test pytest
      # Every feature must assemble into the generated Dockerfile
      - run: uv run --locked --no-default-groups python bin/claude-airlock --dockerfile | grep -q '^ENTRYPOINT'

  # setup-uv's Pythons are built with editline, on Linux as on macOS.
  # actions/setup-python's links GNU readline, which line mode reads lines
  # with where the host's Python has it, and which it handles otherwise
  # (see the end of what claude_airlock/chat/console.py says of itself).
  test-readline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # That Python or none, never one uv would fetch in its place
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: echo "UV_PYTHON=$PYTHON" >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
      # Fails the leg should it ever run editline after all
      - run: uv run --locked --no-default-groups python -c 'import readline, sys; sys.exit(readline.backend != "readline")'
      - run: uv run --locked --no-default-groups --group test pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Base and tail plus one small feature, the full set takes too long
      - run: CLAUDE_AIRLOCK_FEATURES=go bin/claude-airlock --rebuild
