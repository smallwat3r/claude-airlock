name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck bin/claude-statusline test/smoke/run.sh test/smoke/inside/*.sh
      - run: pipx run ruff check bin/claude-airlock claude_airlock test docker/update-pins.py docker/features/excalidraw/excalidraw-export
      - run: pipx run ruff format --check bin/claude-airlock claude_airlock test docker/update-pins.py docker/features/excalidraw/excalidraw-export
      - run: pipx run mypy claude_airlock bin/claude-airlock

  test:
    runs-on: ${{ matrix.os }}
    # The tests end a file that hangs themselves, this is for what they miss
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest the launcher promises to run on, the one macOS ships,
        # and the latest. 3.9 is past its end of life and is not built for
        # runner images after Ubuntu 24.04, so it stays on that one
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
          # Docker Desktop on macOS is supported: the launcher's side of
          # it, which is all these tests run, on the latest Python there
          - python: "3.x"
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python test/launcher_test.py
      # Every feature must assemble into the generated Dockerfile
      - run: python bin/claude-airlock --dockerfile | grep -q '^ENTRYPOINT'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Base and tail plus one small feature, the full set takes too long
      - run: CLAUDE_AIRLOCK_FEATURES=go bin/claude-airlock --rebuild
