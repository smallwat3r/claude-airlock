name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: shellcheck bin/claude-docker bin/claude-statusline test/launcher-test.sh
      - run: test/launcher-test.sh
      - run: pipx run ruff check docker/claude-sandbox/update-pins.py
      # Every feature must assemble into the generated Dockerfile
      - run: bin/claude-docker --dockerfile | grep -q '^ENTRYPOINT'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Base and tail plus one small feature, the full set takes too long
      - run: CLAUDE_DOCKER_FEATURES=go bin/claude-docker --rebuild
