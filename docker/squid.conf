# Egress filter for the Claude sandbox (see claude_sandbox/network.py).
# Default-deny: only domains in allowed-domains.txt are reachable,
# on ports 80/443, plus CONNECT tunnels to 443 and 22 (git over SSH).
http_port 3128
cache deny all
# Squid drops to the 'proxy' user, which cannot open the container's
# stdout pipe (fatal since squid 6.x). Log to the image's log dir instead;
# view with: docker exec claude-egress-proxy tail -f /var/log/squid/access.log
# The launcher mounts a volume there and rotates the log by size, keeping
# the current file and one before it (see EGRESS_LOG_LIMIT in network.py).
# Squid's own format, and after it the bytes the session sent: of a
# tunnel what went up through it, which squid's format leaves out and is
# how much a session sent where (see claude_sandbox/egress_log.py).
logformat sandbox %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %>st
access_log stdio:/var/log/squid/access.log sandbox
logfile_rotate 1

# -n: a destination given as an address is matched as it is, not by the
# name its reverse DNS gives. That name is whatever the owner of the
# address says, one that ends in an allowed domain would open a tunnel.
acl allowed dstdomain -n "/etc/squid/allowed-domains.txt"
acl Safe_ports port 80 443 22
acl SSL_ports port 443 22
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
