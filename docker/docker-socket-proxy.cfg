# HAProxy config for the Docker socket proxy sidecar in its default, limited
# mode (CLAUDE_DOCKER_SOCKET=1, see claude_sandbox/network.py). Replaces the config
# shipped in tecnativa/docker-socket-proxy, whose CONTAINERS switch allows
# every GET under /containers, inspect included, and inspect shows the
# environment of every container on the host.
#
# Allowed here: listing containers (docker ps) and reading their logs.
# Everything else is denied. An edit is picked up by the next session with
# CLAUDE_DOCKER_SOCKET=1, which replaces the sidecar.
global
    log stdout format raw daemon info
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    # Also ends a docker logs -f that stays silent this long
    timeout server 10m

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    # Filled in by the image's entrypoint
    bind ${BIND_CONFIG}

    # Paths are matched undecoded and to the end, so an encoded slash or a
    # longer path never slips through
    acl handshake path -m reg ^(/v[0-9.]+)?/(_ping|version)$
    acl list      path -m reg ^(/v[0-9.]+)?/containers/json$
    acl logs      path -m reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/logs$
    acl inspect   path -m reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$

    # METH_GET covers GET and HEAD
    http-request deny unless METH_GET

    # docker logs inspects the container first, to learn its id and whether
    # it has a TTY. Answer that here with a stub instead of the real thing,
    # so the CLI works and nothing about the container leaks. Ceiling: a
    # container started with a TTY has unframed logs, which the CLI then
    # fails to decode. Use CLAUDE_DOCKER_SOCKET=full for those.
    http-request return status 200 content-type application/json lf-string '{"Id":"%[path,field(-2,/)]","Config":{"Tty":false}}' if inspect

    http-request allow if handshake or list or logs
    http-request deny
    default_backend dockerbackend
