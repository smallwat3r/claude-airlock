# HAProxy config for the Docker socket proxy sidecar in its full mode
# (CLAUDE_AIRLOCK_DOCKER_SOCKET=full, see claude_airlock/sandbox/socket_proxy.py).
# Replaces the config shipped in tecnativa/docker-socket-proxy, whose
# CONTAINERS switch allows every GET under /containers. That is more than
# reads: attach/ws is a GET that writes to the input of a container, and
# archive and export hand out the files of one.
#
# Allowed here: listing containers (docker ps), and of each its logs, its
# real inspect, stats and top. The events of the daemon too, docker stats
# follows them to learn of the containers that start. Everything else is
# denied. inspect shows the environment of every container on the host,
# secrets included. An edit is picked up by the next session with
# CLAUDE_AIRLOCK_DOCKER_SOCKET=full, which replaces the sidecar.
global
    log stdout format raw daemon info
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    # Also ends a docker logs -f that stays silent this long
    timeout server 10m

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    # Filled in by the image's entrypoint
    bind ${BIND_CONFIG}

    # Paths are matched undecoded and to the end, so an encoded slash or a
    # longer path never slips through: a read is named here or it is denied
    acl handshake path -m reg ^(/v[0-9.]+)?/(_ping|version)$
    acl daemon    path -m reg ^(/v[0-9.]+)?/(info|events)$
    acl list      path -m reg ^(/v[0-9.]+)?/containers/json$
    acl read      path -m reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(json|logs|stats|top)$

    # METH_GET covers GET and HEAD
    http-request deny unless METH_GET
    # None of what is allowed is a WebSocket, as attach/ws is: a request
    # that asks to become another protocol is not passed on
    http-request deny if { req.hdr(Upgrade) -m found }

    http-request allow if handshake or daemon or list or read
    http-request deny
    default_backend dockerbackend
